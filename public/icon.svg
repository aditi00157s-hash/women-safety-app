<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#0f0f11"/>
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="256" cy="256" r="160" fill="#e11d48" opacity="0.15" filter="url(#glow)"/>
  <!-- Shield Outline -->
  <path d="M256 80 L380 130 C380 270 256 390 256 420 C256 390 132 270 132 130 Z" fill="url(#shieldGrad)"/>
  <!-- Inner White Heart / Star Symbol -->
  <path d="M256 160 C230 130 190 140 180 180 C165 240 256 300 256 320 C256 300 347 240 332 180 C322 140 282 130 256 160 Z" fill="#ffffff" opacity="0.95"/>
</svg>
